    <div class="page-head rise">
      <div class="page-head-text">
        <div class="eyebrow eyebrow-dot">Lots</div>
        <h1 class="hero-title">Evaluate and watch your own lots</h1>
        <p class="lede">Paste a PropertyRoom lot link. The all-in max is the most you would pay in total: bid, buyer's premium, tax and delivery. Leave it empty and the agent suggests one instead of planning a bid.</p>
      </div>
    </div>

    <section class="card pad rise" aria-labelledby="add-title">
      <h2 id="add-title" class="card-title">Evaluate a lot</h2>
      <form id="add-form" class="form-row">
        <label class="field grow">
          <span>PropertyRoom lot link</span>
          <input id="add-url" type="url" inputmode="url" required autocomplete="off" placeholder="https://www.propertyroom.com/l/item-name/12345678">
        </label>
        <label class="field">
          <span>Your all-in max</span>
          <span class="money-input"><input id="add-max" type="number" min="0" step="0.01" inputmode="decimal" placeholder="optional"></span>
        </label>
        <button class="btn btn-primary" type="submit">Evaluate lot</button>
      </form>
      <p id="lots-assumptions" class="note"></p>
    </section>

    <div class="tools">
      <h2 id="lots-title" class="section-title">Your lots</h2>
      <div class="tools-right">
        <label class="inline-field">
          <span>Re-check</span>
          <select id="auto-check">
            <option value="0">manually</option>
            <option value="5">every 5 minutes</option>
            <option value="15">every 15 minutes</option>
            <option value="60">every hour</option>
          </select>
        </label>
        <button id="check-all" class="btn" type="button">Check all now</button>
      </div>
    </div>
    <div id="lots" class="stack"></div>
